about:
  about:
    enable: true
    title: "About Initiative"
    about_item:
      - icon: "ti-world"
        title: "The Gap"
        content: "Ghana and Cote d'Ivoire produce over 60% of the world's cocoa, yet capture only 2–4% of the value. The highest margins are earned in processing, branding, and distribution outside Africa."
      - icon: "ti-stats-up"
        title: "The Opportunity"
        content: "Beginning with the 2026/27 crop season, Ghana has directed that at least 50% of cocoa beans be processed locally — creating a timely opening for investment into processing infrastructure and market development."
      - icon: "ti-group"
        title: "The Diaspora as the 17th Region"
        content: "Ghana's 17th Region concept treats the global diaspora as a formal partner in investment, innovation, skills transfer, and long-term nation building."

feature:
  feature:
    enable: true
    title: "Ghana's Policy Response"
    content: "The core problem in cocoa is structural. Producing countries export raw beans while the most profitable parts of the value chain — grinding, refining, manufacturing, branding, and retail — are concentrated elsewhere. Ghana's reforms aim to change that."
    image: "images/hero.jpg"
    image_webp: "images/hero.jpg"
    feature_item:
      - icon: "ti-cup"
        title: "50% Local Processing Mandate"
        content: "Starting with the 2026/27 crop season, at least half of Ghana's cocoa beans must be processed domestically, increasing value addition and reducing dependence on raw exports."
      - icon: "ti-settings"
        title: "Sector Reform Agenda"
        content: "Broader reforms are intended to support local processors, revive industrial capacity, and reduce dependence on external financing models that have historically constrained the sector."
      - icon: "ti-rocket"
        title: "From Exporter to Value Creator"
        content: "The policy direction creates a timely opening to transform Ghana from a major raw-bean exporter into a stronger participant in the higher-value segments of the cocoa economy."
      - icon: "ti-check-outlined"
        content: "These reforms address the structural imbalance that keeps producing countries indispensable to global supply but underrepresented in the wealth generated by finished chocolate products."

