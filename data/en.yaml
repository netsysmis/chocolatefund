testimonial:
  testimonial:
    enable: true
    title: "Voices of Conviction"
    bg_image: "images/hero.jpg"
    bg_image_webp: "images/hero.jpg"
    testimonial_item:
      - name: "The Structural Reality"
        date: "Industry Fact"
        content: "Ghana and Cote d'Ivoire produce more than 60% of the world's cocoa, yet they capture only a small share—about 2% to 4% each—of the value created by the global chocolate industry. The highest margins are earned in processing, branding, and distribution outside Africa."
      - name: "A Development Opportunity"
        date: "National Vision"
        content: "For Ghana, this challenge is not only an agricultural issue but also a national development opportunity: by expanding domestic processing, the country can retain more value, create jobs, strengthen industrial capacity, and build a more resilient cocoa economy."
      - name: "Diaspora as Partner"
        date: "17th Region Initiative"
        content: "The global African diaspora is not a symbolic external audience, but a formal partner in investment, innovation, skills transfer, and long-term nation building. Diaspora capital and expertise can help bridge the gap between national ambition and practical industrial expansion."

