    title: "How It Works"
    service_item:
      - icon: "ti-briefcase"
        name: "Connect Capital"
        content: "We channel diaspora investment directly into Ghana's cocoa-processing industry, aligning with national policy objectives for local value addition."
      - icon: "ti-building"
        name: "Support Processing Capacity"
        content: "Funding flows to processing infrastructure, working capital, and market development that help transform Ghana from raw-bean exporter to stronger participant in the higher-value segments of the cocoa economy."
