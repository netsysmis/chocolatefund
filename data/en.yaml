    title: "The Cocoa Value Chain"
    subtitle: "Where the Value Lives"
    content: "The global chocolate market is valued in the tens of billions, yet the wealth it generates flows far from the farms that supply its raw material. Moving up this value chain is the key to transforming Ghana's cocoa economy."
