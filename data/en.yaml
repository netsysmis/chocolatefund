cta:
  cta:
    enable: true
    title: "Join Us in Building Ghana's Cocoa Future"
    content: "The Chocolate Future offers a credible platform for investment that is economically strategic, socially meaningful, and nationally aligned — with Ghana as our home."
    bg_image: "images/hero.jpg"
    bg_image_webp: "images/hero.jpg"
    button:
      enable: true
      label: "Contact Us"
      link: "#contact"

service:
  service:
    enable: true
    title: "How It Works"
    service_item:
      - icon: "ti-briefcase"
        name: "Connect Capital"
        content: "We channel diaspora investment directly into Ghana's cocoa-processing industry, aligning with national policy objectives for local value addition."
      - icon: "ti-building"
        name: "Support Processing Capacity"
        content: "Funding flows to processing infrastructure, working capital, and market development that help transform Ghana from raw-bean exporter to stronger participant in the higher-value segments of the cocoa economy."
      - icon: "ti-announcement"
        name: "Create Employment & Skills Transfer"
        content: "Every investment creates jobs, encourages skills transfer, and contributes to a model of development that aligns commercial returns with national transformation."

